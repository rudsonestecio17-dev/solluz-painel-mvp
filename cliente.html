<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente — Aprovação de Campanhas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#121214] text-zinc-100 min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Cabeçalho da Marca -->
        <div class="bg-[#1a1a1e] border border-zinc-800 rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
            <div class="space-y-1">
                <span class="text-xs uppercase tracking-widest text-indigo-400 font-bold">Portal de Aprovação</span>
                <h1 id="client-title" class="text-2xl font-bold tracking-tight text-white">Carregando marca...</h1>
            </div>
            <div class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-zinc-800 text-zinc-300 border border-zinc-700">
                Solluz Agency
            </div>
        </div>

        <!-- Seção: Criativos e Peças para Validação -->
        <div class="bg-[#1a1a1e] border border-zinc-800 rounded-3xl p-6 md:p-8 space-y-6 shadow-xl">
            <h3 class="font-bold text-sm tracking-wide uppercase text-emerald-400">🎬 Peças para Análise & Aprovação</h3>
            <div id="client-pieces-container" class="space-y-4">
                <p class="text-xs text-zinc-400">Carregando criativos...</p>
            </div>
        </div>
    </div>

    <!-- Script de Carregamento e Interação -->
    <script>
        const SUPABASE_URL = 'https://wiktemdsjwhvzmpnbxmg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Uod7U-Su7MYBcwjWb4dr7w_dzeg2TfY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarPortalCliente() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                document.getElementById('client-title').innerText = 'Acesso Negado';
                document.getElementById('client-pieces-container').innerHTML = `<p class="text-xs text-rose-400">Token de acesso não informado na URL.</p>`;
                return;
            }

            // 1. Busca a marca pelo token
            const { data: clientData, error: clientErr } = await supabaseClient
                .from('clients')
                .select('*')
                .eq('access_token', token)
                .single();

            if (clientErr || !clientData) {
                document.getElementById('client-title').innerText = 'Marca não encontrada';
                return;
            }

            document.getElementById('client-title').innerText = clientData.name;

            // 2. Busca projetos da marca
            const { data: projects } = await supabaseClient
                .from('projects')
                .select('id, title')
                .eq('client_id', clientData.id);

            if (!projects || projects.length === 0) {
                document.getElementById('client-pieces-container').innerHTML = `<p class="text-xs text-zinc-400">Nenhum projeto encontrado para esta marca.</p>`;
                return;
            }
            
            const projectIds = projects.map(p => p.id);

            // 3. Busca as peças de conteúdo
            const { data: pieces } = await supabaseClient
                .from('content_pieces')
                .select('*, projects(title)')
                .in('project_id', projectIds)
                .order('scheduled_date', { ascending: true });

            const container = document.getElementById('client-pieces-container');

            if (pieces && pieces.length > 0) {
                container.innerHTML = '';
                pieces.forEach(p => {
                    const dataFormatada = p.scheduled_date ? p.scheduled_date.split('-').reverse().join('/') : 'A definir';
                    const statusAprovacao = p.approval_status || 'Pendente';
                    
                    let badgeStatus = `<span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-bold rounded-lg uppercase">Pendente de Análise</span>`;
                    if (statusAprovacao === 'Aprovado') {
                        badgeStatus = `<span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold rounded-lg uppercase">Aprovado ✓</span>`;
                    } else if (statusAprovacao === 'Ajuste Solicitado') {
                        badgeStatus = `<span class="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-bold rounded-lg uppercase">Ajuste Solicitado ⚠️</span>`;
                    }

                    container.innerHTML += `
                        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl space-y-4">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div>
                                    <h4 class="font-bold text-white text-sm">${p.title}</h4>
                                    <p class="text-zinc-400 text-xs">Campanha: ${p.projects?.title || 'Geral'} | Data: ${dataFormatada} | Formato: <strong class="uppercase text-zinc-300">${p.piece_type || 'Post'}</strong></p>
                                </div>
                                ${badgeStatus}
                            </div>

                            ${p.media_url ? `
                                <div class="pt-1">
                                    <a href="${p.media_url}" target="_blank" class="inline-flex items-center gap-1.5 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold rounded-xl transition shadow-xs">
                                        <span>Visualizar / Baixar Mídia ↗</span>
                                    </a>
                                </div>
                            ` : ''}

                            <!-- Área de Ação e Feedback -->
                            <div class="pt-3 border-t border-zinc-800/80 space-y-3">
                                <div class="flex flex-wrap gap-2">
                                    <button onclick="enviarAprovacao('${p.id}', 'Aprovado')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow-md">
                                        Aprovar Peça
                                    </button>
                                    <button onclick="toggleBoxAjuste('${p.id}')" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold rounded-xl transition">
                                        Solicitar Ajuste / Comentar
                                    </button>
                                </div>

                                <!-- Caixa Oculta para Comentário de Ajuste -->
                                <div id="box-ajuste-${p.id}" class="hidden space-y-2 pt-2">
                                    <textarea id="feedback-${p.id}" rows="2" placeholder="Descreva o que precisa ser ajustado nesta peça..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs text-zinc-200 focus:outline-none font-medium">${p.client_feedback || ''}</textarea>
                                    <button onclick="enviarAjuste('${p.id}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition">
                                        Enviar Feedback para a Agência
                                    </button>
                                </div>
                                ${p.client_feedback ? `<p class="text-[11px] text-zinc-400 bg-zinc-950 p-3 rounded-xl border border-zinc-800"><strong class="text-zinc-300">Seu comentário:</strong> ${p.client_feedback}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<p class="text-xs text-zinc-400">Nenhuma peça cadastrada para validação no momento.</p>`;
            }
        }

        function toggleBoxAjuste(pieceId) {
            const box = document.getElementById(`box-ajuste-${pieceId}`);
            box.classList.toggle('hidden');
        }

        async function enviarAprovacao(pieceId, status) {
            if(!confirm('Deseja realmente aprovar esta peça de conteúdo?')) return;
            const { error } = await supabaseClient
                .from('content_pieces')
                .update({ approval_status: status, client_feedback: 'Aprovado pelo cliente.' })
                .eq('id', pieceId);

            if (error) {
                alert('Erro ao atualizar: ' + error.message);
            } else {
                alert('Peça aprovada com sucesso! A agência foi notificada.');
                carregarPortalCliente();
            }
        }

        async function enviarAjuste(pieceId) {
            const feedbackText = document.getElementById(`feedback-${pieceId}`).value.trim();
            if(!feedbackText) return alert('Escreva o feedback antes de enviar.');

            const { error } = await supabaseClient
                .from('content_pieces')
                .update({ approval_status: 'Ajuste Solicitado', client_feedback: feedbackText })
                .eq('id', pieceId);

            if (error) {
                alert('Erro ao enviar feedback: ' + error.message);
            } else {
                alert('Feedback enviado com sucesso para a agência!');
                carregarPortalCliente();
            }
        }

        carregarPortalCliente();
    </script>
</body>
</html>
