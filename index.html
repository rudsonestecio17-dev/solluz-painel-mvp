<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solluz — Gestão de Produção</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts Inter para um visual limpo e profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen flex flex-col">

    <!-- Header Minimalista e Profissional -->
    <header class="border-b border-zinc-200 bg-white sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                <h1 class="font-semibold text-base tracking-tight text-zinc-900">SOLLUZ <span class="text-zinc-400 font-normal">| Produção</span></h1>
            </div>
            <div class="flex items-center space-x-2 text-xs text-zinc-500 font-medium">
                <span>Status do Banco:</span>
                <span id="db-status" class="px-2 py-0.5 rounded bg-zinc-100 text-zinc-700 border border-zinc-200">Conectando...</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-1 w-full space-y-8">
        
        <!-- Seção de Cabeçalho da Página -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-2xl font-semibold tracking-tight text-zinc-900">Projetos Ativos</h2>
                <p class="text-sm text-zinc-500 mt-1">Acompanhe o andamento das campanhas e entregas em tempo real.</p>
            </div>
            <button onclick="carregarDadosProjetos()" class="inline-flex items-center justify-center px-4 py-2 text-xs font-medium text-zinc-700 bg-white border border-zinc-200 rounded-lg shadow-sm hover:bg-zinc-50 transition">
                Atualizar Dados
            </button>
        </div>

        <!-- Tabela Minimalista -->
        <div class="bg-white border border-zinc-200 rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-zinc-50 border-b border-zinc-200 text-zinc-500 font-medium text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4 pl-6">Projeto</th>
                            <th class="p-4">Detalhes</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 pr-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body" class="divide-y divide-zinc-100 text-zinc-700">
                        <tr>
                            <td colspan="4" class="p-6 text-center text-zinc-400">Carregando dados do Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Botão Flutuante do Robô (Copiloto) -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleChat()" class="w-14 h-14 bg-zinc-900 hover:bg-zinc-800 text-white rounded-full shadow-xl flex items-center justify-center transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-900">
            <!-- Ícone de Robô Minimalista SVG -->
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-1.072 1.922L6.75 11.85m7.5-8.746v5.714a2.25 2.25 0 001.072 1.922l1.928 1.11M12 15.75v3.75m-4.5-9h9M7.5 12h9a2.25 2.25 0 012.25 2.25v4.5A2.25 2.25 0 0116.5 21h-9a2.25 2.25 0 01-2.25-2.25v-4.5A2.25 2.25 0 017.5 12z" />
            </svg>
        </button>
    </div>

    <!-- Janela Pop-up do Chat / Copiloto -->
    <div id="chat-window" class="fixed bottom-24 right-6 w-96 bg-white border border-zinc-200 rounded-2xl shadow-2xl z-50 hidden flex-col overflow-hidden transition-all">
        <!-- Header do Chat -->
        <div class="bg-zinc-900 text-white px-5 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span class="font-medium text-sm">Copiloto Solluz</span>
            </div>
            <button onclick="toggleChat()" class="text-zinc-400 hover:text-white text-sm font-medium">✕</button>
        </div>

        <!-- Mensagens -->
        <div id="chat-messages" class="p-4 h-80 overflow-y-auto space-y-3 text-xs bg-zinc-50/50 flex flex-col">
            <div class="bg-white border border-zinc-200 text-zinc-700 p-3 rounded-xl max-w-[85%] self-start shadow-sm">
                Olá! Como posso ajudar você a consultar os projetos hoje?
            </div>
        </div>

        <!-- Input -->
        <div class="p-3 bg-white border-t border-zinc-200 flex gap-2">
            <input type="text" id="chat-input" placeholder="Digite sua pergunta..." class="flex-1 bg-zinc-50 border border-zinc-200 rounded-lg px-3 py-2 text-xs text-zinc-900 focus:outline-none focus:border-zinc-400">
            <button onclick="sendMessage()" class="bg-zinc-900 hover:bg-zinc-800 text-white px-3 py-2 rounded-lg text-xs font-medium transition">Enviar</button>
        </div>
    </div>

    <!-- Script de Conexão e Lógica -->
    <script>
        const SUPABASE_URL = 'https://wiktemdsjwhvzmpnbxmg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Uod7U-Su7MYBcwjWb4dr7w_dzeg2TfY';

        let supabaseClient = null;

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const statusEl = document.getElementById('db-status');
            statusEl.innerText = 'Conectado';
            statusEl.className = 'px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium';
            carregarDadosProjetos();
        } catch (e) {
            const statusEl = document.getElementById('db-status');
            statusEl.innerText = 'Erro';
            statusEl.className = 'px-2 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200 font-medium';
        }

        async function carregarDadosProjetos() {
            const tbody = document.getElementById('projects-table-body');

            const { data, error } = await supabaseClient
                .from('projects')
                .select('*');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-rose-600">Erro ao carregar: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-zinc-400">Nenhum projeto cadastrado no banco ainda.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(proj => {
                tbody.innerHTML += `
                    <tr class="hover:bg-zinc-50/80 transition">
                        <td class="p-4 pl-6 font-medium text-zinc-900">${proj.title}<br><span class="text-xs text-zinc-400 font-normal">${proj.description || 'Sem descrição'}</span></td>
                        <td class="p-4 text-zinc-500 text-xs">Campanha Principal</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">${proj.status}</span></td>
                        <td class="p-4 pr-6 text-right"><button class="text-zinc-600 hover:text-zinc-900 font-medium text-xs">Gerenciar</button></td>
                    </tr>
                `;
            });
        }

        // Função para abrir/fechar a janela do chat flutuante
        function toggleChat() {
            const windowChat = document.getElementById('chat-window');
            if (windowChat.style.display === 'flex') {
                windowChat.style.display = 'none';
            } else {
                windowChat.style.display = 'flex';
                document.getElementById('chat-input').focus();
            }
        }

        // Simulação do Chat
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const chatMessages = document.getElementById('chat-messages');
            const text = input.value.trim();

            if (!text) return;

            chatMessages.innerHTML += `<div class="bg-zinc-900 text-white p-2.5 rounded-xl max-w-[85%] self-end">${text}</div>`;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                chatMessages.innerHTML += `<div class="bg-white border border-zinc-200 text-zinc-700 p-2.5 rounded-xl max-w-[85%] self-start shadow-sm">Entendido! Estou analisando os registros no Supabase para esta solicitação.</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
